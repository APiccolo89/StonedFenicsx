name: test_git_action

on: # Tell to do these checks only during pull request to main
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-linux:
    name: test_git_action
    runs-on: ubuntu-latest

    permissions: # Tell that it can write
      contents: write

    defaults:                     # NEW: login shell, so conda is initialised in every step
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4 # use the action

      - name: Set up conda environment   # NEW: replaces setup-python + "Add conda to system path" + "Install dependencies"
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: stonedenvironment.yml
          activate-environment: stonedfenicsx
          auto-activate-base: false

      - name: Check environment          # optional, useful for debugging
        run: |
          conda info
          python --version
          python -c "import dolfinx; print(dolfinx.__version__)"

      - name: Test with pytest and coverage # run all the tests
        run: |
          python -u -m pytest -vv -s \
          --cov=stonedfenicsx \
          --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
            token: ${{ secrets.CODECOV_TOKEN }}

  post-test: # Deployment enviroment => This must succed to be able to push to master
    needs: build-linux
    runs-on: ubuntu-latest

    environment:
      name: post-test

    steps:
      - name: Post-test successful
        run: echo "Tests passed successfully."